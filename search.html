<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <!-- links -->
     <link rel="icon" href="./assets/favicon.png">
    <link rel="stylesheet" href="./CSS/styleSearch.css">
</head>
<body>
    <script defer src="./JS/searchJS.js">

    </script>

    <header>
        <img src="./assets/logoPokedex.png" alt="">
    </header>
    <main>
        <img src="assets/pokedex.png" alt="" class="pokedex">

        <h1 class="pokemonData">
            <span class="pokeId">384</span> -
            <span class="pokeName">rayquaza</span>
        </h1>

            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/384.gif" alt="" id="imgPoke">

        

        <form class="form">
            <input type="search" class="input_search" placeholder="Name Or ID" required>
        </form>

        <div class="botoes">
            <button class="prev">Prev &lt</button>
            <button class="next">Next &gt</button>
        </div>

        <div class="types">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-vi/omega-ruby-alpha-sapphire/16.png" alt="" class="type0">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-vi/omega-ruby-alpha-sapphire/3.png" alt="" class="type1">
        </div>
    </main>
</body>
</html>
